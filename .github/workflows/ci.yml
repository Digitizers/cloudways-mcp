name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  version-sync:
    name: Version sync (declarations always; release+marker on main only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKILL: .claude/skills/cloudways-mcp/SKILL.md
    steps:
      - uses: actions/checkout@v7

      - name: All three version declarations agree
        id: ver
        run: |
          skill_v=$(grep -m1 '^version:' "$SKILL" | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
          pkg_v=$(jq -r .version package.json)
          # Color-agnostic: match the semver itself, not the badge color suffix.
          readme_v=$(grep -oE 'badge/version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's|badge/version-||')
          echo "SKILL.md=$skill_v  package.json=$pkg_v  README badge=$readme_v"
          [ -n "$skill_v" ] || { echo "::error::no version in $SKILL"; exit 1; }
          if [ "$skill_v" != "$pkg_v" ] || [ "$skill_v" != "$readme_v" ]; then
            echo "::error::version mismatch — SKILL.md=$skill_v, package.json=$pkg_v, README badge=$readme_v. Bump all three in the same commit."
            exit 1
          fi
          echo "version=$skill_v" >> "$GITHUB_OUTPUT"

      # Only on main: a PR that bumps the version cannot have a release yet
      # (the tag has to point at the merged commit), so gating PRs would deadlock.
      #
      # THE PROOF IS THE MARKER ASSET, not release existence. Only
      # publish-clawhub.yml writes `clawhub-published.txt` onto the release, and
      # only after its publish command succeeded — so a queued/canceled/failed
      # publish behind a UI release, a leftover draft, or a bare tag all stay red
      # here no matter what the releases page shows. Release existence alone
      # proved nothing: a UI release satisfies it seconds before its publish run
      # has even started.
      - name: A published release exists, ClawHub confirmed it, payload matches
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # On a push to main this step starts the moment the merge lands, and
          # both things it looks for arrive AFTER it: the release seconds to
          # minutes later, and the marker only once publish-clawhub.yml has
          # finished its publish. Judging on the first look turned the ordinary
          # release flow into a red check on main's head (release-drift.yml had
          # the same race; measured there: hostinger-mcp v1.2.1 was cut 19 s
          # after the merge, wordpress-api-pro v3.9.5 52 min after). So wait -
          # up to 20 x 30 s - for the release AND the marker. Still absent after
          # ten minutes is the drift this step is for, reported as before.
          # 21 looks, 20 sleeps: the first look is immediate and the last one
          # lands at the full ten minutes, the same shape release-drift.yml
          # has - a final sleep with no look after it would end the window
          # at 9:30 and miss a marker that arrived in the last half minute.
          attempt=0
          while :; do
            verdict=""
            # Capture stderr instead of discarding it: a network/auth failure must not
            # be misread as "no release" (and vice versa).
            if ! out=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets 2>"$RUNNER_TEMP/gherr"); then
              err=$(cat "$RUNNER_TEMP/gherr")
              case "$err" in
                *"release not found"*|*"Not Found"*|*"HTTP 404"*)
                  state="no release"
                  verdict="::error::SKILL.md is at $VERSION but there is no v$VERSION release, so ClawHub is still serving the previous version. Cut one with: gh workflow run release.yml"
                  ;;
                *)
                  echo "$err"
                  echo "::error::could not query releases (this is NOT a verdict on whether v$VERSION exists): $err"
                  exit 1
                  ;;
              esac
            # A draft is not a publication: no release event fired, nothing reached
            # ClawHub — and gh release view DOES find drafts when authenticated.
            elif [ "$(jq -r '.isDraft' <<<"$out")" = "true" ]; then
              state="draft"
              verdict="::error::v$VERSION exists only as a DRAFT release — nothing was published to ClawHub. Publish it via release.yml (or delete the leftover draft and re-run: gh workflow run release.yml)"
            # The marker is uploaded by publish-clawhub.yml after a successful real
            # publish, and by nothing else. No marker = the publish never completed
            # (still queued, canceled, or failed) even though the release is up.
            elif [ "$(jq -r '[.assets[].name] | index("clawhub-published.txt") != null' <<<"$out")" != "true" ]; then
              state="release without marker"
              verdict="::error::the v$VERSION release exists but carries no clawhub-published.txt marker — its ClawHub publish never completed. Check the publish-clawhub.yml runs for v$VERSION; once ClawHub really serves $VERSION, re-attach the marker (gh release upload v$VERSION clawhub-published.txt --clobber), or delete the release and re-run release.yml."
            fi
            [ -n "$verdict" ] || break
            [ "$attempt" -lt 20 ] || break
            attempt=$((attempt + 1))
            echo "$state for v$VERSION - waiting 30 s (retry $attempt/20)"
            sleep 30
          done
          if [ -n "$verdict" ]; then
            echo "$verdict"
            exit 1
          fi
          echo "release v$VERSION is published and ClawHub confirmed it (marker present)"

          # Same version ⇒ same payload. A push that edits the skill directory
          # without bumping the version would otherwise pass here while ClawHub
          # keeps serving the payload frozen at the tag.
          PAYLOAD_DIR=$(dirname "$SKILL")
          git fetch --no-tags --depth=1 origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          if git diff --quiet "v$VERSION" HEAD -- "$PAYLOAD_DIR"; then
            echo "payload matches the released v$VERSION tag — ClawHub is in sync"
          else
            echo "::error::$PAYLOAD_DIR changed since v$VERSION was released, but the version was not bumped — ClawHub is serving the old payload under the same version. Bump the version (all three declarations + CHANGELOG) and release."
            git diff --stat "v$VERSION" HEAD -- "$PAYLOAD_DIR"
            exit 1
          fi

  skill:
    runs-on: ubuntu-latest
    env:
      SKILL: .claude/skills/cloudways-mcp/SKILL.md
    steps:
      - uses: actions/checkout@v7

      - name: SKILL frontmatter lint
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          p = pathlib.Path(os.environ["SKILL"]).read_text()
          m = re.match(r'^---\n(.*?)\n---\n', p, re.S)
          assert m, "missing frontmatter"
          fm = m.group(1)
          for k in ("name", "description", "version"):
              mm = re.search(rf'^{k}:\s*(.+)$', fm, re.M)
              assert mm and mm.group(1).strip(), f"frontmatter missing non-empty {k}"
          print("frontmatter OK")
          PY

      - name: Reference links exist
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          skill = pathlib.Path(os.environ["SKILL"])
          base = skill.parent
          refs = re.findall(r'references/[A-Za-z0-9_-]+\.md', skill.read_text())
          missing = [r for r in set(refs) if not (base / r).exists()]
          assert not missing, f"missing referenced files: {missing}"
          print(f"references OK ({len(set(refs))} linked)")
          PY

      - name: No-leak guard
        run: |
          set -euo pipefail
          # The shipped skill payload (.claude/) must stay studio-neutral and
          # generic — no studio framing or personal names inside the skill itself.
          # "digitizer-skills" (public marketplace) and the "Digitizers/" org prefix are
          # allowed. Strip those exact tokens, then re-scan the residue — so a line like
          # "Digitizers/digitizer-os" still fails on its remaining "digitizer-os" part,
          # unlike a line-level grep -v exemption which would wave the whole line through.
          if grep -rniE "digitizer|דיגיטייזר|Ben/Avi" .claude/ | perl -pe 's/(?<![A-Za-z0-9-])digitizer-skills(?![A-Za-z0-9-])//g; s/(?<![A-Za-z0-9-])Digitizers\///g' | grep -iE "digitizer|דיגיטייזר|Ben/Avi"; then
            echo "::error::studio framing / personal names found in the skill payload — keep .claude/ generic"; exit 1
          fi
          # The repo-level README may carry the studio brand footer (Digitizer),
          # but must never expose personal names.
          if grep -rniE "Ben/Avi|benkalsky" README.md; then
            echo "::error::personal name found in README — use the studio brand, not personal names"; exit 1
          fi
          # Secret-shaped strings must never appear in the payload — nor in the
          # tracked MCP configs, which are placeholder-only by policy. Strip the
          # "path:line:" grep prefix before the exemption filter: otherwise the
          # ".mcp.json.example" filename matches the "example" exemption and waves
          # real tokens in that file through.
          if grep -rniE "(api[_-]?key|bearer|secret|password|access[_-]?token)[\"'[:space:]=:]+[A-Za-z0-9/_-]{24,}" .claude/ .mcp.json .mcp.json.example \
             | sed 's/^[^:]*:[0-9]*://' \
             | grep -viE "your-|YOUR_|CLIENT_[AB]|example|<|\$\{|placeholder"; then
            echo "::error::possible real secret found"; exit 1
          fi
          # The line-based grep can be evaded by valid JSON that splits key and
          # value across lines, and its charset misses base64-style tokens with
          # . + =. Parse the tracked MCP configs and check the actual env/header
          # VALUES, independent of layout: each must be an env placeholder or too
          # short to be a live credential.
          python3 - <<'PY'
          import json, re, sys
          PLACEHOLDER = re.compile(r'\$\{[A-Za-z_][A-Za-z0-9_]*(:-([^}]*))?\}')
          def secret_shaped(val):
              # A live credential can hide INSIDE placeholder defaults
              # (${VAR:-<secret>}), outside placeholders, or SPLIT across several
              # defaults (${A:-half1}${B:-half2}) — so the COMBINED length of all
              # :- defaults plus the literal residue must stay below credential
              # size. Env-var expansion of unset vars yields exactly that
              # combination, so this bounds what the value can expand to.
              total = len(PLACEHOLDER.sub('', val))
              for m in PLACEHOLDER.finditer(val):
                  total += len(m.group(2) or '')
              return total >= 24
          bad = []
          for path in ('.mcp.json', '.mcp.json.example'):
              with open(path) as f:
                  cfg = json.load(f)
              for name, srv in cfg.get('mcpServers', {}).items():
                  for section in ('env', 'headers'):
                      for key, val in srv.get(section, {}).items():
                          if isinstance(val, str) and secret_shaped(val):
                              bad.append(f'{path}: {name}.{section}.{key}')
          if bad:
              print('::error::secret-shaped value in tracked MCP config (placeholder-only policy):')
              [print('  ' + b) for b in bad]
              sys.exit(1)
          print('mcp placeholder-value guard passed')
          PY
          echo "no-leak guard passed"
